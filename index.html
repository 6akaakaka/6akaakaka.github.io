<style>
:root{--bg:#110c1f;--bg2:#2a1646;--card:#17102aaa;--line:#3b2a63;--text:#f4efff;--muted:#a99cc4;--accent:#9b6bea;--accent2:#c8a6ff;--btn-text:#150d28;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#110c1f;--bg2:#2a1646;--card:#17102aaa;--line:#3b2a63;--text:#f4efff;--muted:#a99cc4;--accent:#9b6bea;--accent2:#c8a6ff;--btn-text:#150d28}}
:root[data-theme="dark"]{--bg:#110c1f;--bg2:#2a1646;--card:#17102aaa;--line:#3b2a63;--text:#f4efff;--muted:#a99cc4;--accent:#9b6bea;--accent2:#c8a6ff;--btn-text:#150d28}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 20% 0%,var(--bg2),transparent 70%),var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);transform:translateZ(0);z-index:5;background:radial-gradient(900px 500px at 20% 0%,var(--bg2),transparent 70%),var(--bg);border-bottom:1px solid var(--line)}
.logo,nav ul,nav a{transition:color .25s}
.status{display:flex;width:fit-content;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;text-decoration:none;margin-bottom:6px}
.status.live{color:#fff;background:#e8323c;border-color:#e8323c;animation:glow 1.6s infinite}
.status .dot{display:inline-block}
.status.live .dot{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,50,60,.7)}100%{box-shadow:0 0 0 12px rgba(232,50,60,0)}}

nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);font-size:1rem}
nav ul{display:flex;gap:0;list-style:none;margin:0;padding:0}
nav a{color:var(--muted);text-decoration:none;font-weight:600}
nav a{padding:6px 5px}nav a.on{color:#fff!important}@media (hover:hover){nav a:hover{color:var(--text)}}
.banner{display:block;text-align:center;margin:12px 0 0;padding:14px;border:1px solid var(--accent);border-radius:14px;background:var(--card);color:var(--text);font-weight:700;text-decoration:none}
h1{font-size:clamp(2.6rem,9vw,5rem);line-height:1;letter-spacing:-.05em;margin:48px 0 20px}
h1 span{background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:1.15rem;max-width:560px}
.btn{display:inline-block;margin-top:20px;padding:16px 26px;border-radius:14px;background:var(--accent);color:var(--btn-text);font-weight:800;text-decoration:none;box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.card{border:1px solid var(--line);border-radius:24px;background:var(--card);padding:18px}
.video{margin-top:44px;max-width:460px}
.thumb{aspect-ratio:16/10;border-radius:16px;background:linear-gradient(135deg,#0b0714,#2a1646);display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:16px}
.thumb i{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#e8323c;font-style:normal;font-size:1.6rem;margin:0 auto 10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:800;font-size:1.2rem}
h2{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.04em;margin:80px 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.link{display:block;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:22px;background:var(--card);padding:20px;min-height:150px;position:relative}
.link:hover{border-color:var(--accent)}
.link .ic{font-size:1.5rem;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--accent) 18%,transparent);margin-bottom:18px}
.link h3{margin:0;font-size:1.2rem}
.link p{margin:4px 0 0;color:var(--muted)}
.link .ar{position:absolute;top:18px;right:20px;color:var(--muted)}
.wide{grid-column:1/-1;min-height:0}
.setup{margin-top:40px;padding:32px 24px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--accent) 14%,transparent))}
.setup h2{margin:0 0 16px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.specs div{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card)}
.specs small{display:block;color:var(--muted);font-weight:600}
footer{text-align:center;color:var(--muted);padding:20px 0 28px}
main{scroll-margin-top:120px}#video,#kapcsolat{scroll-margin-top:100px}
main.wrap{padding-bottom:8vh}
.livebar{display:block;margin:16px 0 0;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:18px;max-width:560px}
.livebar[hidden]{display:none}
.livebar img{display:block;width:100%;border-radius:16px}
.livebar{color:inherit;text-decoration:none}
.status{display:flex;width:fit-content;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;margin:0 0 6px}
.status.live{color:#fff;background:#e8323c;border-color:#e8323c;animation:glow 1.6s infinite}
.status .dot{display:inline-block}
.status.live .dot{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,50,60,.7)}100%{box-shadow:0 0 0 12px rgba(232,50,60,0)}}
@media (min-width:720px){
main.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;align-items:start}
main.wrap>*{grid-column:1/-1}
main.wrap>#video{grid-column:1;order:1}
main.wrap>#liveBanner{grid-column:2;order:2;max-width:none}
main.wrap>#video,main.wrap>#liveBanner{align-self:stretch;margin:44px 0 0}
main.wrap>#liveBanner:not([hidden]){display:flex;flex-direction:column}
main.wrap>#liveBanner img{flex:1 1 0;min-height:0;width:100%;object-fit:cover}
main.wrap>.grid{order:3}
main.wrap>.btn{justify-self:start}
}
</style>
</head>

<script>
(function(){
var els=[document.querySelector('nav ul')];
var thumbs=document.querySelectorAll('.thumb');
function update(){
els.forEach(function(el){
var r=el.getBoundingClientRect(),white=false;
thumbs.forEach(function(t){var b=t.getBoundingClientRect();
if(b.top<r.bottom&&b.bottom>r.top&&b.left<r.right&&b.right>r.left){white=true;}});
el.classList.toggle('w',white);
});
}
addEventListener('scroll',update,{passive:true});
addEventListener('resize',update);
update();
})();
</script>
<script>
(function(){
var links=document.querySelectorAll('nav a');
var ids=['#fooldal','#video','.grid'];
function spot(){
if(window.__forced!=null){links.forEach(function(a,i){a.classList.toggle('on',i===window.__forced);});return;}
var y=window.scrollY+window.innerHeight*0.55,cur=0;
ids.forEach(function(id,i){var e=document.querySelector(id);if(e&&e.getBoundingClientRect().top+window.scrollY<=y)cur=i;});
if(window.scrollY>20&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=ids.length-1;
if(window.scrollY<20)cur=0;else if(cur===0)cur=-1;
links.forEach(function(a,i){a.classList.toggle('on',i===cur);});
}
addEventListener('scroll',spot,{passive:true});addEventListener('resize',spot);spot();
links.forEach(function(a,i){a.addEventListener('click',function(){window.__forced=i;spot();});});
['wheel','touchmove','keydown'].forEach(function(ev){addEventListener(ev,function(){window.__forced=null;spot();},{passive:true});});
})();
</script>
